# FinPay local runtime test profile

spring.application.name=FinPay API Test

# Use the dedicated local test JWT secret
jwt.secret=${TEST_JWT_SECRET}
jwt.expiration=3600000

# Deterministic demo mode
finpay.mode=DEMO

# Local frontend during runtime testing
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
